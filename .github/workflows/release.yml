# タグ push で全プラットフォームのビルド→updater署名→latest.json統合→GitHub Release を行う。
# バージョン反映とタグ作成はローカルの scripts/release.sh が担当する。
#
# 前提 Secrets:
#   TAURI_SIGNING_PRIVATE_KEY          … ~/.tauri/cc-anatomy.key の中身（紛失すると更新配信不能）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD … 空文字列（鍵はパスワードなし生成）
#
# 以下は macOS の Apple 署名・公証用（任意。手順は docs/apple-signing-setup.md）。
# APPLE_CERTIFICATE が未登録の間は署名インポート手順自体をスキップし、従来どおり
# 未署名ビルドが通る。注意: APPLE_* の実値をジョブ共通 env に置いてはいけない。
# 未登録の secret は「空文字列だが定義済み」の env になり、tauri の bundler が
# 空の証明書インポートを試みてビルドごと失敗する（v0.4.6 初回リリースで実発生）。
# Apple 系 env は署名有効時のみ GITHUB_ENV 経由で後続ステップに現れる構造にする:
#   APPLE_CERTIFICATE          … Developer ID Application 証明書（.p12）を base64 化したもの
#   APPLE_CERTIFICATE_PASSWORD … .p12 書き出し時に設定したパスワード
#   KEYCHAIN_PASSWORD           … CI 一時キーチェーン用の任意パスワード（Apple とは無関係、任意の文字列でよい）
#   APPLE_ID                    … 署名に使う Apple ID のメールアドレス
#   APPLE_PASSWORD               … その Apple ID の「App用パスワード」（app-specific password。通常のパスワードではない）
#   APPLE_TEAM_ID                … Apple Developer の Team ID
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      # tauri-action の latest.json 統合は「既存をダウンロード→platforms をマージ→再アップロード」の
      # read-modify-write のため、並列実行するとプラットフォームのエントリが消える。直列で回す
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
    runs-on: ${{ matrix.platform }}
    env:
      # if: 条件式では secrets コンテキストを直接参照できないため、「有無」だけを橋渡しする。
      # 実値は絶対にここへ置かない（未登録でも定義済み env になり bundler が誤作動する）
      APPLE_SIGNING_ENABLED: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # universal ビルドは両アーキテクチャの標準ライブラリが必要
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # APPLE_CERTIFICATE が未登録なら丸ごとスキップする（署名なしビルドを継続するため）。
      # CI 専用の一時キーチェーンを作って証明書をインポートし、次のビルドステップが
      # 参照する署名IDを CERT_ID として $GITHUB_ENV 経由で渡す
      # （公式サンプル: tauri-apps/tauri-action の examples/publish-to-auto-release-
      # universal-macos-app-with-signing-certificate.yml を踏襲）
      - name: Apple Developer Certificate をインポート
        if: ${{ env.APPLE_SIGNING_ENABLED == 'true' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f certificate.p12
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          # 署名有効時のみ、後続の tauri-action が読む Apple 系 env を定義する
          {
            echo "APPLE_SIGNING_IDENTITY=$CERT_ID"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      # release.sh が注釈付きタグにリリースノートを入れて push してくる
      - name: タグ注釈をリリースノートとして取り出す
        id: notes
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          NOTES="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")"
          [ -z "$NOTES" ] && NOTES="CC Anatomy ${GITHUB_REF_NAME}"
          { echo 'body<<NOTES_EOF'; echo "$NOTES"; echo 'NOTES_EOF'; } >> "$GITHUB_OUTPUT"

      # Apple 系 env（APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID）は
      # 署名有効時のみ、上のインポートステップが GITHUB_ENV 経由で定義する。
      # ここで宣言してはいけない（未登録時に空定義となり bundler が誤作動する）
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CC Anatomy ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
