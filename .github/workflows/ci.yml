# push / PR ごとのコンパイル検証。
# Windows 実機を持たない開発体制のため、クロスプラットフォームの回帰は
# ここで検知するしかない（generate_context! が dist を要求するため先にフロントを build する）
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: フロントエンドの型検査とビルド
        run: npm run build

      - name: Rust のコンパイル検査
        run: cargo check --manifest-path src-tauri/Cargo.toml
