[package]
name = "cc-dashboard"
version = "0.6.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cc_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-dialog = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# TLS 構成は tauri-plugin-updater と同一（rustls + ring）にして依存ツリーを共有する。
# aws-lc-rs を混ぜると Windows CI にビルドツール要求が増えるため避ける
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# ライブ資格情報の同一性検証（sync-back 前の外部書き換え検知）に使う暗号学的ハッシュ。
# 純 Rust 実装で Windows/Linux でも追加のビルドツール要求が増えない
sha2 = "0.10"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# その他アカウントの部分色付きテキスト行（トレイメニュー）を CoreText で描画するため。
# core-graphics は tauri の依存ツリーに既にある 0.25 系に合わせてバージョン競合を避ける
core-text = "22"
core-graphics = "0.25"
core-foundation = "0.10"
# トレイメニューのライト/ダーク判定（NSApplication.effectiveAppearance）に使う。
# tauri の依存ツリーに既にある 0.3.2 系（objc2 は 0.6 系）に合わせてバージョン競合を避ける
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSAppearance", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSString"] }

